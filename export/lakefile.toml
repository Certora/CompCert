name = "compcert-clight-lean"
# Lake project for the Lean side of the `clightgen -lean` work.
#
#   CCLib       : the Clight semantics, interpreter, memory model and
#                 separation logic (see LEAN.md)
#   Clightdefs  : the module every `clightgen -lean` output imports
#   Examples    : examples/ — generated test programs (Gen*), the proofs about
#                 them (*Sep, IsSorted*), and the non-vacuity / axiom checks
#                 (*Check).  Regression tests for the library and templates
#                 for new proofs; nothing outside examples/ depends on them.
#
# DiffRun.lean is not a library: test/lean/diff_exec.sh compiles it directly
# against each generated program.
#
# Build with:  lake build
defaultTargets = ["CCLib", "Clightdefs", "Examples"]

[[lean_lib]]
name = "CCLib"

[[lean_lib]]
name = "Clightdefs"

[[lean_lib]]
name = "Examples"
srcDir = "examples"
roots = ["Demo", "GenMain", "GenSwap", "GenStruct", "GenStructCopy", "GenLocalVar", "GenFuncPtr", "GenGotoLeave", "GenGotoBack", "GenU16Loop", "GenOOB", "IsSortedReal", "IsSortedSep", "SwapSep", "StructSep", "StructCopySep", "LocalVarSep", "FuncPtrSep", "GotoSep", "GotoBackSep", "U16LoopSep", "OOBSep", "MemCheck", "SepCheck", "DetermCheck", "TempsCheck"]
